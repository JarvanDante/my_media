# Docker 容器内配置（mydocker / jarven）
# MinIO 预签名给浏览器用：endpoint 走宿主机映射端口，避免签出 minio:9000

server:
  address:     ":8004"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  clientMaxBodySize: "2GB"

logger:
  level: "all"
  stdout: true

database:
  default:
    link: "pgsql:postgres:654321@tcp(postgres:5432)/my_media?sslmode=disable"

security:
  admin_token: "488ac147a8b24d2b0541b24f4fdfb5f8b10c20129f6b46fcce6d2091094e872a"

minio:
  # 与浏览器同一可达地址，保证预签名 Host 可直传
  endpoint: "host.docker.internal:19000"
  access_key: "minioadmin"
  secret_key: "minioadmin123"
  bucket: "my-media"
  use_ssl: false
  public_base: "http://127.0.0.1:19000"
  presign_expire_sec: 7200

kafka:
  enabled: true
  brokers:
    - "kafka:29092"
  topic_jobs: "media.transcode.jobs"
  topic_results: "media.transcode.results"
  group: "my_media"

transcode:
  profile: "h264_hls"
  biz: "media"
  cover_seek_sec: 8

# 短剧 zip 导入上限。压缩包(max_zip_bytes)须小于请求体(max_body_bytes)，预留 multipart 表单余量。
# 默认按公网可达性：Cloudflare 免费/Pro 单请求约 100MB，不能只靠调大 Ingress/clientMaxBodySize 传到 2GB。
# import_timeout_sec 须不超过 Ingress/代理的 proxy-read/send-timeout（当前 600s），超时即失败。
# server.clientMaxBodySize 仍为 2GB，是给漫画等其它导入留的进程上限，短剧以本段为准。
drama_import:
  max_zip_bytes: 96000000
  max_body_bytes: 100000000
  max_extract_bytes: 192000000
  max_files: 500
  max_file_bytes: 96000000
  max_ratio: 100
  min_free_bytes: 1073741824
  import_timeout_sec: 600

# 播放网关(my_play): 配置后对外播放地址改为网关签名地址; 留空则回退 MinIO 直链
play_gateway:
  base_url: "http://127.0.0.1:8006"
  secret: "dev-play-secret-change-me"   # 必须与 my_play 的 play.secret 一致
  token_ttl_sec: 14400

# 封面 AES-128-ECB, 必须 16 字节, 与 H5 VITE_AES_BNC_KEY 相同
image_aes:
  key: "dafb787c76b5ce8a"

# Open 开放接口平台级防刷(按 app_key/站点聚合统计, 超限 429)
# 注意: 这是"每站点上限", 拦不住站内单个用户; 站内按用户限流在站点后端做
open_ratelimit:
  per_min: 60      # 每分钟每站点 play-token 签发上限
  per_hour: 600    # 每小时每站点 play-token 签发上限
