# 复制为 config.yaml 后按需修改（config.yaml 已被 gitignore）
# cp manifest/config/config.example.yaml manifest/config/config.yaml

server:
  address:     ":8004"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

database:
  default:
    link: "pgsql:postgres:654321@tcp(127.0.0.1:5432)/my_media?sslmode=disable"

security:
  # 本地请用 openssl rand -hex 32 生成后写入 config.yaml（勿把真实值提交仓库）
  admin_token: "change-me-with-openssl-rand-hex-32"

minio:
  # Docker 常见映射 19000:9000，本机用宿主机端口
  endpoint: "127.0.0.1:19000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "my-media"
  use_ssl: false
  # 公开访问根(不含 key); 也可写成 http://127.0.0.1:19000/my-media
  public_base: "http://127.0.0.1:19000"
  presign_expire_sec: 7200

kafka:
  enabled: true
  brokers:
    - "127.0.0.1:9092"
  topic_jobs: "media.transcode.jobs"
  topic_results: "media.transcode.results"
  group: "my_media"

transcode:
  profile: "h264_hls"
  biz: "media"
  cover_seek_sec: 8

# 播放网关(my_play): 配置后对外播放地址改为网关签名地址; 留空则回退 MinIO 直链
play_gateway:
  base_url: "http://127.0.0.1:8006"
  secret: "dev-play-secret-change-me"   # 必须与 my_play 的 play.secret 一致
  token_ttl_sec: 14400
