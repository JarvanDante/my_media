# 复制为 config.yaml 后按需修改（config.yaml 已被 gitignore）
# cp manifest/config/config.example.yaml manifest/config/config.yaml

server:
  address:     ":8004"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  clientMaxBodySize: "2GB"

logger:
  level: "all"
  stdout: true

database:
  default:
    link: "pgsql:postgres:654321@tcp(127.0.0.1:5432)/my_media?sslmode=disable"

security:
  # 本地请用 openssl rand -hex 32 生成后写入 config.yaml（勿把真实值提交仓库）
  admin_token: "change-me-with-openssl-rand-hex-32"

minio:
  # Docker 常见映射 19000:9000，本机用宿主机端口
  endpoint: "127.0.0.1:19000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "my-media"
  use_ssl: false
  # 公开访问根(不含 key); 也可写成 http://127.0.0.1:19000/my-media
  public_base: "http://127.0.0.1:19000"
  presign_expire_sec: 7200

kafka:
  enabled: true
  brokers:
    - "127.0.0.1:9092"
  topic_jobs: "media.transcode.jobs"
  topic_results: "media.transcode.results"
  group: "my_media"

transcode:
  profile: "h264_hls"
  biz: "media"
  cover_seek_sec: 8

# 短剧 zip：整包分片落到 MinIO 后由异步任务解压入库；单次 HTTP（分片代传、兼容整包 POST）仍受公网约 100MB 限制。
# 分片默认 32MiB，须显著小于 max_body_bytes，预留协议余量。压缩包/单文件上限与请求体解耦，勿再把单集硬限制在 96MB。
# import_timeout_sec 是单次 HTTP 时限（须不超过 Ingress/代理 600s）；job_timeout_sec 是后台导入任务时限。
# server.clientMaxBodySize 仍为 2GB，是进程级上限；不能只靠调大 Ingress 让公网单请求超过 Cloudflare 限额。
drama_import:
  max_zip_bytes: 8589934592
  max_body_bytes: 100000000
  max_chunk_bytes: 33554432
  max_extract_bytes: 17179869184
  max_files: 2000
  max_file_bytes: 2147483648
  max_ratio: 100
  min_free_bytes: 1073741824
  import_timeout_sec: 600
  job_timeout_sec: 7200
  max_running_jobs: 1

# 播放网关(my_play): 配置后对外播放地址改为网关签名地址; 留空则回退 MinIO 直链
play_gateway:
  base_url: "http://127.0.0.1:8006"
  secret: "dev-play-secret-change-me"   # 必须与 my_play 的 play.secret 一致
  token_ttl_sec: 14400

# 封面 AES-128-ECB, 必须 16 字节, 与 H5 VITE_AES_BNC_KEY 相同
image_aes:
  key: "dafb787c76b5ce8a"

# Open 开放接口平台级防刷(按 app_key/站点聚合统计, 超限 429)
# 注意: 这是"每站点上限", 拦不住站内单个用户; 站内按用户限流在站点后端做
open_ratelimit:
  per_min: 60      # 每分钟每站点 play-token 签发上限
  per_hour: 600    # 每小时每站点 play-token 签发上限
